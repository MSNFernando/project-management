# Spring Boot Application Configuration
# SpringPM - Project Management Platform

# ============================================================================
# APPLICATION
# ============================================================================
spring.application.name=springpm
server.port=8080
server.servlet.context-path=/api

# Disable Anthropic auto-configuration by default (will be enabled only if ANTHROPIC_API_KEY is set)
spring.autoconfigure.exclude=org.springframework.ai.model.anthropic.autoconfigure.AnthropicChatAutoConfiguration,org.springframework.ai.model.anthropic.autoconfigure.AnthropicEmbeddingAutoConfiguration

# ============================================================================
# DATABASE (PostgreSQL)
# ============================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/springpm}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ============================================================================
# JWT CONFIGURATION
# ============================================================================
app.jwt.secret=${JWT_SECRET:your-secret-key-change-in-production-at-least-32-characters}
app.jwt.expiration=3600000
app.jwt.refresh-expiration=604800000

# ============================================================================
# SECURITY
# ============================================================================
spring.security.user.name=admin
spring.security.user.password=${ADMIN_PASSWORD:admin}

# ============================================================================
# KAFKA CONFIGURATION
# ============================================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.consumer.group-id=springpm-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# ============================================================================
# MINIO CONFIGURATION (Object Storage)
# ============================================================================
app.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
app.minio.access-key=${MINIO_USER:minioadmin}
app.minio.secret-key=${MINIO_PASSWORD:minioadmin}
app.minio.bucket.uploads=uploads
app.minio.bucket.documents=documents

# ============================================================================
# REST DOCS
# ============================================================================
spring.restdocs.api-documentation.path=/docs/api.html

# ============================================================================
# ACTUATOR
# ============================================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true

# ============================================================================
# LOGGING
# ============================================================================
logging.level.com.springpm=${LOGGING_LEVEL_COM_SPRINGPM:INFO}
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ============================================================================
# THYMELEAF (for email templates)
# ============================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ============================================================================
# MAIL CONFIGURATION
# ============================================================================
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ============================================================================
# CORS CONFIGURATION
# ============================================================================
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:8080
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
app.cors.allowed-headers=*
app.cors.allow-credentials=true
app.cors.max-age=3600

# ============================================================================
# SPRING AI - ANTHROPIC (Optional)
# ============================================================================
# Set ANTHROPIC_API_KEY in your environment or .env file to enable AI features
spring.ai.anthropic.api.key=${ANTHROPIC_API_KEY:}
# Optional: Configure Anthropic chat model if API key is provided
spring.ai.anthropic.chat.options.model=claude-3-5-sonnet-20241022

# ============================================================================
# PROFILES
# ============================================================================
spring.profiles.active=dev
